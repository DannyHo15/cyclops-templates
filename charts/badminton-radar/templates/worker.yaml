apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-worker
  labels:
    {{- include "radar.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two Chromiums must never share one browser profile directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}-worker
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-worker
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: wait-for-migrations
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              while :; do
                current="$(alembic current 2>/dev/null | awk 'NF {print $1}' | sort | tr '\n' ' ')"
                heads="$(alembic heads 2>/dev/null | awk '{print $1}' | sort | tr '\n' ' ')"
                [ -n "$current" ] && [ "$current" = "$heads" ] && break
                sleep 5
              done
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
      containers:
        - name: worker
          image: "{{ .Values.image.apiRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker.run_worker"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: MEDIA_STORAGE_DIR
              value: /data/media
            - name: BROWSER_PROFILES_DIR
              value: /data/profiles
            - name: PLAYWRIGHT_HEADLESS
              value: "true"
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-data
        # Chromium needs a larger /dev/shm than the 64Mi default; counts against the memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
