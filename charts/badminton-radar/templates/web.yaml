apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-web
  labels:
    {{- include "radar.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}-web
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-web
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.webRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3200
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-web
  labels:
    {{- include "radar.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.name }}-web
  ports:
    - name: http
      port: 80
      targetPort: http
