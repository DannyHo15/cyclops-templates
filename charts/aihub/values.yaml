name: aihub
existingSecret: aihub-secrets

image:
  apiRepository: ghcr.io/dannyho15/aihub-api
  adminRepository: ghcr.io/dannyho15/aihub-admin
  tag: sha-0000000
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

ingress:
  className: traefik
  adminHost: aihub.danny.io.vn
  apiHost: api-aihub.danny.io.vn

postgres:
  image: pgvector/pgvector:0.8.7-pg16
  storage: 10Gi
  storageClass: local-path

redis:
  image: redis:7.4.2-alpine

backup:
  storage: 20Gi
  storageClass: local-path
  schedule: "17 2 * * *"

resources:
  api:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  worker:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  admin:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
  postgres:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  redis:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
