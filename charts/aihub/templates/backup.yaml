apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aihub-backups
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.backup.storageClass }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aihub-pg-dump
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              command: ["sh", "-ec"]
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -Fc > "/backups/aihub-${stamp}.dump"
                  ls -1t /backups/aihub-*.dump | tail -n +8 | xargs -r rm -f
              env:
                - name: PGHOST
                  value: aihub-postgres
                - name: PGUSER
                  value: postgres
                - name: PGDATABASE
                  value: aihub
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: aihub-backups
