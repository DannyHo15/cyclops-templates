apiVersion: v1
kind: Service
metadata:
  name: aihub-postgres
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: aihub-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aihub-postgres
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  serviceName: aihub-postgres
  replicas: 1
  selector:
    matchLabels:
      app: aihub-postgres
  template:
    metadata:
      labels:
        app: aihub-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: aihub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U postgres -d aihub"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U postgres -d aihub"]
            periodSeconds: 15
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
