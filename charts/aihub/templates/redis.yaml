apiVersion: v1
kind: Service
metadata:
  name: aihub-redis
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  selector:
    app: aihub-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aihub-redis
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aihub-redis
  template:
    metadata:
      labels:
        app: aihub-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
