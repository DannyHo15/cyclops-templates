apiVersion: apps/v1
kind: Deployment
metadata:
  name: aihub-admin
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aihub-admin
  template:
    metadata:
      labels:
        app: aihub-admin
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.image.adminRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources.admin | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aihub-admin
  labels:
    {{- include "aihub.labels" . | nindent 4 }}
spec:
  selector:
    app: aihub-admin
  ports:
    - name: http
      port: 80
      targetPort: http
